<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Peri — Assistive Communication</title>
    <meta
      name="description"
      content="Assistive communication driven entirely by gaze and dwell. Hover and hold to build a message and speak it aloud."
    />

    <!-- No `robots` meta tag: the default is to index, and public/robots.txt
         says the same thing out loud. If one of them ever changes, the other
         has to change with it or the site ends up half-hidden. -->

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Peri — Assistive Communication" />
    <meta
      property="og:description"
      content="Assistive communication driven entirely by gaze and dwell. Hover and hold to build a message and speak it aloud."
    />

    <meta name="theme-color" content="#0f0f0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Peri" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- iOS ignores an SVG here, so the home-screen icon has to be a PNG. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
