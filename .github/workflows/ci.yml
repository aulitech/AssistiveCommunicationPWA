# The gate every change passes before it reaches main, and the release that
# follows it there. See *Checks, releases and publishing* in AGENTS.md.
#
# `check` is what main requires of a pull request, and of itself once something
# has merged. It ran as Netlify's build command until this existed, which made
# every deploy preview take eight to ten minutes and was the only thing standing
# between a change and main.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A pull request's newer push replaces its older run. Main's are left alone:
  # each says whether what is on main now is sound, and the answer for one
  # commit is not the answer for the next.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0 # .mise.toml and netlify.toml say the same
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
