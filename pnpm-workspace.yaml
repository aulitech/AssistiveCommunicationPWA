# pnpm settings. Not a workspace — pnpm 11 stopped reading the `pnpm` field in
# package.json and this file is where every setting lives now.

# esbuild's install script links the platform binary for this machine. pnpm asks
# before running any dependency's install script, and until something answers it
# refuses every command with ERR_PNPM_IGNORED_BUILDS — `pnpm check` and the
# Netlify build included, so an unanswered prompt is a broken deploy.
#
# Yes, because this is not a new trust decision: esbuild is already how Vite
# builds this app, so it executes on every build whatever this file says. The
# file is committed so that CI gets the same answer as a laptop; left untracked,
# pnpm writes the placeholder again on the next machine and the deploy stops.
allowBuilds:
  esbuild: true

# oxfmt pins tinypool to exactly 2.1.0, which has two critical advisories
# (prototype pollution into RCE through worker and run() options). 2.1.2 is the
# patch release of that version and fixes both. Drop this once oxfmt asks for
# 2.1.2 or later on its own — a newer oxfmt does, but upgrading the formatter
# can rewrite the tree, so that is its own change.
overrides:
  tinypool: 2.1.2
